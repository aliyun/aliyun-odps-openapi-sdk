name: Publish Catalog API Go

on:
  push:
    tags:
      - "catalog-api/go/v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify build
        run: |
          cd catalog-api/go
          go mod tidy
          go build ./...

      - name: Notify
        run: |
          tag_name="${GITHUB_REF##*/}"
          echo "Tag $tag_name published successfully."
          echo "Go module proxy will index: github.com/aliyun/aliyun-odps-openapi-sdk/catalog-api/go@${tag_name}"
